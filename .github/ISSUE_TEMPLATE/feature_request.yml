name: Feature request
description: Suggest a change to an existing part of the kit.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: What are you trying to do, and what is in the way?}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: What would you like instead?, description: A sketch of the API or markup helps.}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives you tried}
