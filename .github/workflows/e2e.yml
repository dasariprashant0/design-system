name: e2e
on:
  pull_request:
  push:
    branches: [master]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      # Real keyboard and pointer input in Chrome against apps/docs/dist. One retry; a test that needs it is reported as FLAKY.
      - run: npm run e2e -- --retries 1
        env:
          CHROME: /usr/bin/google-chrome
