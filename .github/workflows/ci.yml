name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm run check
      - run: npm run build
      - name: Built files are committed
        run: git diff --exit-code css/monoline.css css/monoline.min.css tokens/tokens.json
