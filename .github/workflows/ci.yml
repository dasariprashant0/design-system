name: ci
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npm run test:cli
      - run: npm run test:mcp
      - run: npm run build
      - run: npm run size
      - run: npm run registry
      - name: Tokens are up to date
        run: node packages/tokens/scripts/build.mjs && git diff --exit-code packages/tokens/dist
      - name: Registry and llms files are up to date
        run: git diff --exit-code registry llms.txt llms-full.txt
