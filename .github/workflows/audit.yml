name: audit
# Real-browser checks on the built docs site: axe (WCAG 2 A/AA, 2.1, 2.2 AA with colour contrast), overflow,
# console errors, plus a visual comparison against the base branch. Chrome is preinstalled on ubuntu runners.
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # One job per accent, in parallel (each accent is ~170 pages x 3 themes x 2 viewports in one Chrome).
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        accent: [orange, green, blue, violet, rose, teal, amber, slate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Audit all pages, 3 themes, desktop and 375px, accent ${{ matrix.accent }}
        run: node scripts/audit.mjs --accents ${{ matrix.accent }}
        env:
          CHROME: /usr/bin/google-chrome
  css-computed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Computed-style test (real browser, loads the full stylesheet)
        run: npm run test:css-browser
        env:
          CHROME: /usr/bin/google-chrome
  # Single check name for the whole audit, so anything that waits for "a11y" keeps working.
  a11y:
    needs: [audit, css-computed]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all accents and the computed-style test passed"
  visual:
    # Informational: it reports every page whose screenshot differs from the base branch. A pull request that
    # intentionally changes the look will always differ, so this job never blocks a merge; read the artifact.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.pull_request.base.sha }}"}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - name: Write baseline screenshots from the base branch
        run: node scripts/audit.mjs --visual --update
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/checkout@v4
        with: {clean: false}
      - run: npm ci
      - run: npm run build
      - name: Compare screenshots with the base branch
        run: node scripts/audit.mjs --visual
        env:
          CHROME: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-diffs
          path: audit/actual
