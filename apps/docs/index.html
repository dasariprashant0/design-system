<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monoline</title>
  <meta name="description" content="Monoline: an open-source UI kit with plain CSS tokens and accessible React components." />
  <script>
    // Restores the deep link that public/404.html saved before redirecting here (GitHub Pages).
    try {
      var r = sessionStorage.getItem('monoline-redirect');
      sessionStorage.removeItem('monoline-redirect');
      if (r && r !== location.href) history.replaceState(null, '', r);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
